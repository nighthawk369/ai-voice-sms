name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'What to test?'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - backend-only
          - frontend-only
          - mobile-only

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aivoicesms_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Run migrations
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/aivoicesms_test
      run: |
        cd backend
        alembic upgrade head

    - name: Run API tests
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/aivoicesms_test
        REDIS_URL: redis://localhost:6379
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret
      run: |
        cd backend
        python -m pytest tests/test_auth.py tests/test_api.py -v --cov=app --cov-report=xml

    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/aivoicesms_test
        REDIS_URL: redis://localhost:6379
        OPENAI_API_KEY: test-key
        JWT_SECRET: test-secret
      run: |
        cd backend
        python -m pytest tests/test_integration.py -v
      continue-on-error: true

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml
        fail_ci_if_error: false

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Run linting
      run: |
        cd frontend
        npm run lint || true

    - name: Run type check
      run: |
        cd frontend
        npx tsc --noEmit || true

    - name: Build
      run: |
        cd frontend
        npm run build

  mobile-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: mobile/package-lock.json

    - name: Install dependencies
      run: |
        cd mobile
        npm ci

    - name: Run linting
      run: |
        cd mobile
        npm run lint || true

    - name: Run type check
      run: |
        cd mobile
        npx tsc --noEmit || true

  terraform-validation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: Validate AWS Terraform
      run: |
        cd infrastructure/terraform/aws
        terraform init -backend=false
        terraform validate

    - name: Validate GCP Terraform
      run: |
        cd infrastructure/terraform/gcp
        terraform init -backend=false
        terraform validate
      continue-on-error: true

    - name: Terraform format check
      run: |
        terraform fmt -recursive -check infrastructure/ || true
