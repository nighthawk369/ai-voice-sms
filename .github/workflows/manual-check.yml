name: Manual Checks

on:
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Which checks to run?'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - security-only
          - tests-only
          - backend-only
          - frontend-only
          - mobile-only
          - lint-only

jobs:
  full-check:
    if: github.event.inputs.check_type == 'full' || github.event.inputs.check_type == 'tests-only'
    runs-on: ubuntu-latest
    name: Full Test Suite

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aivoicesms_test

    steps:
    - uses: actions/checkout@v4

    - name: Backend Tests
      if: github.event.inputs.check_type == 'full' || github.event.inputs.check_type == 'tests-only' || github.event.inputs.check_type == 'backend-only'
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -q -r requirements.txt
        python -m pytest tests/ -v --tb=short || true

    - name: Frontend Tests
      if: github.event.inputs.check_type == 'full' || github.event.inputs.check_type == 'tests-only' || github.event.inputs.check_type == 'frontend-only'
      working-directory: ./frontend
      run: |
        npm ci --legacy-peer-deps
        npm run build
        npm run lint || true

    - name: Mobile Type Check
      if: github.event.inputs.check_type == 'full' || github.event.inputs.check_type == 'tests-only' || github.event.inputs.check_type == 'mobile-only'
      working-directory: ./mobile
      run: |
        npm ci
        npx tsc --noEmit || true

  security-check:
    if: github.event.inputs.check_type == 'full' || github.event.inputs.check_type == 'security-only'
    runs-on: ubuntu-latest
    name: Security Checks

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Backend Security
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -q bandit safety
        bandit -r app -f json -o bandit-report.json || true
        safety check --json || true
        echo "✅ Backend security check complete"

    - name: Frontend Security
      working-directory: ./frontend
      run: |
        npm ci --legacy-peer-deps
        npm audit --audit-level=moderate --production 2>&1 || echo "Review warnings"
        echo "✅ Frontend security check complete"

    - name: Secret Scanning
      run: |
        pip install -q truffleHog3
        echo "🔍 Scanning for secrets..."
        truffleHog filesystem . --json 2>/dev/null | head -50 || echo "Filesystem scan complete"
        echo "✅ Secret scanning complete"

  lint-check:
    if: github.event.inputs.check_type == 'full' || github.event.inputs.check_type == 'lint-only'
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
    - uses: actions/checkout@v4

    - name: Python Linting
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -q black ruff isort pyright
        black --check app/ || true
        ruff check app/ || true
        isort --check-only app/ || true
        pyright --outputjson app/ > pyright.json || true
        echo "✅ Python linting complete"

    - name: JavaScript Linting
      working-directory: ./frontend
      run: |
        npm ci --legacy-peer-deps
        npm run lint || true
        echo "✅ JavaScript linting complete"

  summary:
    name: Check Summary
    runs-on: ubuntu-latest
    needs: [full-check, security-check, lint-check]
    if: always()

    steps:
    - name: Summary
      run: |
        echo "✅ Manual checks complete!"
        echo ""
        echo "Check Type: ${{ github.event.inputs.check_type }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "Timestamp: $(date)"
        echo ""
        echo "Job Results:"
        echo "  Full Check: ${{ needs.full-check.result || 'skipped' }}"
        echo "  Security Check: ${{ needs.security-check.result || 'skipped' }}"
        echo "  Lint Check: ${{ needs.lint-check.result || 'skipped' }}"
