name: Load Testing

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production
      duration:
        description: 'Test duration (seconds)'
        required: false
        default: '60'
      concurrent_users:
        description: 'Concurrent users'
        required: false
        default: '100'

jobs:
  load-test:
    name: Load Testing - ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js (for k6)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install k6
      run: |
        sudo apt-get update
        sudo apt-get install -y apt-transport-https
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        curl https://dl.k6.io/k6-repo.key | sudo apt-key add -
        sudo apt-get update
        sudo apt-get install -y k6

    - name: Get API Endpoint
      id: endpoint
      run: |
        case "${{ github.event.inputs.environment }}" in
          dev)
            echo "endpoint=https://dev-api.callsync.io" >> $GITHUB_OUTPUT
            ;;
          staging)
            echo "endpoint=https://staging-api.callsync.io" >> $GITHUB_OUTPUT
            ;;
          production)
            echo "endpoint=https://api.callsync.io" >> $GITHUB_OUTPUT
            ;;
        esac

    - name: Run Load Tests
      run: |
        cat > load-test.js << 'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export const options = {
          stages: [
            { duration: '10s', target: 10 },    // Ramp up
            { duration: '30s', target: __ENV.USERS || 100 },  // Main load
            { duration: '10s', target: 0 },     // Ramp down
          ],
          thresholds: {
            http_req_duration: ['p(95)<500', 'p(99)<1000'],
            http_req_failed: ['rate<0.1'],
          },
        };

        export default function () {
          // Health check
          let res = http.get('__ENV.API/health/ready');
          check(res, { 'health check ok': (r) => r.status === 200 });
          sleep(1);

          // Get business types
          res = http.get('__ENV.API/api/v1/business-types');
          check(res, {
            'business types status': (r) => r.status === 200,
            'has types': (r) => r.body.includes('business_types'),
          });
          sleep(1);

          // Simulate login attempt
          res = http.post('__ENV.API/api/v1/auth/login', {
            email: 'test@example.com',
            password: 'test123456',
          });
          check(res, {
            'login response': (r) => [401, 200].includes(r.status),
          });
          sleep(1);
        }
        EOF

        export API="${{ steps.endpoint.outputs.endpoint }}"
        export USERS="${{ github.event.inputs.concurrent_users }}"
        k6 run load-test.js

    - name: Generate Report
      if: always()
      run: |
        echo "📊 Load Test Report"
        echo "===================="
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Duration: ${{ github.event.inputs.duration }}s"
        echo "Concurrent Users: ${{ github.event.inputs.concurrent_users }}"
        echo ""
        echo "✅ Load test completed"
        echo "Check logs above for detailed results"

  notification:
    name: Load Test Summary
    runs-on: ubuntu-latest
    needs: load-test
    if: always()

    steps:
    - name: Summary
      run: |
        echo "🎯 Load Testing Complete"
        echo "========================"
        echo ""
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Target Users: ${{ github.event.inputs.concurrent_users }}"
        echo "Duration: ${{ github.event.inputs.duration }}s"
        echo ""
        if [ "${{ needs.load-test.result }}" == "success" ]; then
          echo "✅ Load test passed"
          echo "API handled the load successfully"
        else
          echo "⚠️ Load test failed"
          echo "Check logs for performance issues"
        fi
