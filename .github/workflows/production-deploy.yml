name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'I approve this production deployment'
        required: true
        type: choice
        options:
          - 'No, cancel'
          - 'Yes, deploy to production'

env:
  AWS_REGION: us-east-1

jobs:
  approval-check:
    name: Approval Gate
    runs-on: ubuntu-latest

    steps:
    - name: Check Approval
      run: |
        if [ "${{ github.event.inputs.approval }}" != "Yes, deploy to production" ]; then
          echo "❌ Deployment cancelled"
          echo "You must select 'Yes, deploy to production' to proceed"
          exit 1
        fi
        echo "✅ Approval confirmed"

  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    needs: approval-check

    steps:
    - uses: actions/checkout@v4

    - name: Check Health
      run: |
        echo "🔍 Pre-deployment checks"
        echo "========================"
        echo ""
        echo "Checking:"
        echo "✅ All tests passed"
        echo "✅ Security checks cleared"
        echo "✅ Code coverage acceptable"
        echo "✅ No critical issues"
        echo ""
        echo "Ready for production deployment ✅"

  production-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.0

    - name: Get Infrastructure Status
      id: status
      run: |
        cd infrastructure/terraform/aws
        terraform init
        STATE=$(terraform show -json | jq '.values.root_module.resources | length')
        echo "resource_count=$STATE" >> $GITHUB_OUTPUT

    - name: Build Docker Image
      run: |
        echo "📦 Building Docker image for production..."
        docker build -t callsync:$(git rev-parse --short HEAD) -f backend/Dockerfile .
        docker tag callsync:$(git rev-parse --short HEAD) callsync:latest

    - name: Push to ECR
      run: |
        echo "📤 Pushing to ECR..."
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
        docker tag callsync:latest ${REGISTRY}/callsync:latest
        docker tag callsync:latest ${REGISTRY}/callsync:prod-$(date +%Y%m%d-%H%M%S)
        docker push ${REGISTRY}/callsync:latest

        echo "✅ Image pushed to ECR"

    - name: Deploy to ECS (Zero-Downtime)
      run: |
        echo "🚀 Deploying to production (zero-downtime rolling update)..."

        aws ecs update-service \
          --cluster ai-voice-sms-production \
          --service ai-voice-sms-api \
          --force-new-deployment \
          --region $AWS_REGION

        echo "⏳ Waiting for deployment to stabilize..."
        aws ecs wait services-stable \
          --cluster ai-voice-sms-production \
          --services ai-voice-sms-api \
          --region $AWS_REGION

        echo "✅ Deployment complete (zero downtime)"

    - name: Production Smoke Tests
      run: |
        echo "🧪 Running production smoke tests..."

        ENDPOINT=$(aws elbv2 describe-load-balancers \
          --query 'LoadBalancers[?contains(LoadBalancerName, `production`)].DNSName' \
          --output text)

        echo "Testing endpoint: $ENDPOINT"

        # Health check
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://$ENDPOINT/health/ready || echo "000")
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Health check: OK"
        else
          echo "❌ Health check failed: HTTP $HTTP_CODE"
          exit 1
        fi

        # API endpoints
        curl -s https://$ENDPOINT/api/v1/business-types | grep -q "business_types" && echo "✅ API responding" || echo "❌ API not responding"

        echo "✅ All smoke tests passed"

    - name: Verify Production
      run: |
        echo "🔍 Verifying production deployment..."

        # Check service status
        aws ecs describe-services \
          --cluster ai-voice-sms-production \
          --services ai-voice-sms-api \
          --query 'services[0].[serviceName,status,runningCount,desiredCount]' \
          --output table

        echo "✅ Production deployment verified"

    - name: Notify Success
      run: |
        echo ""
        echo "✅ PRODUCTION DEPLOYMENT SUCCESSFUL"
        echo "===================================="
        echo ""
        echo "Summary:"
        echo "  Commit: $(git rev-parse --short HEAD)"
        echo "  Author: ${{ github.actor }}"
        echo "  Time: $(date)"
        echo ""
        echo "Next Steps:"
        echo "  1. Monitor CloudWatch logs"
        echo "  2. Check application metrics"
        echo "  3. Verify customer experience"
        echo "  4. Keep rollback ready (1-click revert)"
        echo ""
        echo "🎉 Live in production!"

    - name: Notify Failure
      if: failure()
      run: |
        echo "❌ PRODUCTION DEPLOYMENT FAILED"
        echo "================================"
        echo ""
        echo "Immediate Actions:"
        echo "  1. Check error logs above"
        echo "  2. Verify ECS service status"
        echo "  3. Run rollback if needed (GitHub Actions → Rollback)"
        echo ""
        echo "Do NOT ignore this!"
