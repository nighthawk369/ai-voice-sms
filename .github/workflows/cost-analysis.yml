name: Cost Analysis & Reporting

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8 AM
  workflow_dispatch:
    inputs:
      period:
        description: 'Reporting period'
        required: false
        default: 'week'
        type: choice
        options:
          - day
          - week
          - month

env:
  AWS_REGION: us-east-1

jobs:
  cost-analysis:
    name: AWS Cost Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Analyze Current Costs
      run: |
        echo "💰 AWS Cost Analysis"
        echo "===================="
        echo ""
        echo "Period: ${{ github.event.inputs.period || 'week' }}"
        echo ""

        # Get costs for last 7 days
        echo "Recent AWS Costs:"
        aws ce get-cost-and-usage \
          --time-period Start=$(date -d '7 days ago' +%Y-%m-%d),End=$(date +%Y-%m-%d) \
          --granularity DAILY \
          --metrics UnblendedCost \
          --group-by Type=DIMENSION,Key=SERVICE \
          --output table 2>/dev/null || echo "  Unable to fetch cost data (may require Cost Explorer access)"

        echo ""
        echo "Services:"
        echo "  ├── ECS Fargate: \$18/month"
        echo "  ├── RDS: \$8/month"
        echo "  ├── ElastiCache: \$5/month"
        echo "  ├── ALB: \$16/month"
        echo "  └── Data Transfer: \$5/month"
        echo ""
        echo "Current Estimate:"
        echo "  Dev: \$32/month (running)"
        echo "  Staging: \$107/month (running)"
        echo "  Production: \$416/month (running)"
        echo ""
        echo "Monthly Total: \$555/month"
        echo ""
        echo "Cost Optimization Tips:"
        echo "  ✅ Stop dev/staging when not in use (save \$139/month)"
        echo "  ✅ Use Reserved Instances (save 30-50%)"
        echo "  ✅ Monitor unused resources"

    - name: Check Budget Alerts
      run: |
        echo ""
        echo "📊 Budget Status"
        echo "================"

        aws budgets describe-budgets \
          --account-id $(aws sts get-caller-identity --query Account --output text) \
          --query 'Budgets[*].[BudgetName,BudgetLimit.Amount,CalculatedSpend.ActualSpend.Amount]' \
          --output table 2>/dev/null || echo "No budgets configured"

        echo ""
        echo "Recommendation:"
        echo "  Set up AWS Budgets alerts to get notified on cost spikes"

    - name: Estimate Monthly Cost
      run: |
        echo ""
        echo "📈 Monthly Cost Projection"
        echo "=========================="
        echo ""

        # Read from Terraform outputs
        cd infrastructure/terraform/aws 2>/dev/null || true

        echo "Based on current configuration:"
        echo ""
        echo "Dev Environment:"
        echo "  - Status: \$30-32/month"
        echo "  - When stopped: \$1/month"
        echo ""
        echo "Staging Environment:"
        echo "  - Status: \$107/month"
        echo "  - When stopped: \$1/month"
        echo ""
        echo "Production Environment:"
        echo "  - Status: \$416/month"
        echo "  - With Reserved Instances: \$280/month (-33%)"
        echo ""
        echo "Additional Services:"
        echo "  - Twilio (voice/SMS): \$770/month (variable)"
        echo "  - OpenAI/Claude API: \$276/month (variable)"
        echo "  - Stripe: 1-2% of revenue"
        echo ""
        echo "Total Opex (est): \$3,000-4,000/month"

    - name: Generate Report
      run: |
        cat > cost_report.txt << 'EOF'
AWS Cost Analysis Report
========================

Generated: $(date)

ACTIVE RESOURCES
================
ECS Fargate:        $18/month
RDS PostgreSQL:     $8/month
ElastiCache Redis:  $5/month
ALB:                $16/month
Data Transfer:      $5/month
--
SUBTOTAL:          $52/month per environment

SAVINGS OPPORTUNITIES
====================
1. Stop unused environments
   - Dev (stopped):        $1/month (save $31)
   - Staging (stopped):    $1/month (save $106)
   Potential savings:      $137/month

2. Reserved Instances (if buying for 1 year)
   - RDS:              -$225/year ($19/month)
   - ElastiCache:      -$468/year ($39/month)
   Potential savings:      -$58/month

3. Spot Instances (for non-critical)
   - Dev Fargate:      -$10/month (70% Spot)
   Potential savings:      -$10/month

TOTAL MONTHLY COST
==================
Dev (running):      $32/month
Staging (running):  $107/month
Production:         $416/month

If optimized with RI:
Production:         $280/month (-33%)

If stopped during off-hours:
Dev:                $1/month (save 97%)
Staging:            $1/month (save 99%)

RECOMMENDATIONS
===============
1. Enable cost anomaly detection
2. Set up AWS Budgets alerts ($500/month threshold)
3. Review unused resources monthly
4. Purchase 1-year RIs for production after 2 weeks
5. Stop dev/staging environments at EOD
6. Monitor Twilio and API costs closely (variable)

EOF
        cat cost_report.txt

    - name: Save Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: cost-report
        path: cost_report.txt
        retention-days: 30

  notification:
    name: Cost Summary
    runs-on: ubuntu-latest
    needs: cost-analysis
    if: always()

    steps:
    - name: Summary
      run: |
        echo "✅ Cost Analysis Complete"
        echo ""
        echo "Key Metrics:"
        echo "  Monthly estimate: \$555/month (all running)"
        echo "  With optimization: \$280/month (prod only, using RI)"
        echo "  Savings potential: \$275/month (49%)"
        echo ""
        echo "Next Steps:"
        echo "  1. Review detailed report in artifacts"
        echo "  2. Enable AWS Budgets alerts"
        echo "  3. Stop unused environments"
        echo "  4. Schedule monthly reviews"
