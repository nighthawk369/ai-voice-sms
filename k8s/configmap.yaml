apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-config
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  DATABASE_NAME: ai_platform
  POSTGRES_USER: dev
  # DATABASE_URL will be constructed using secrets or env vars
  REDIS_URL: redis://redis-service:6379/0
  NEXT_PUBLIC_API_URL: http://api-service:8000
