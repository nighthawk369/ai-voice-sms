---
# Redis ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: ai-platform-dev
  labels:
    app: redis
    environment: dev
data:
  redis.conf: |
    # Redis Configuration
    port 6379
    bind 0.0.0.0

    # Memory management
    maxmemory 256mb
    maxmemory-policy allkeys-lru

    # Persistence
    save 900 1
    save 300 10
    save 60 10000

    # Logging
    loglevel notice

    # Client settings
    timeout 0
    tcp-keepalive 300

    # Performance tuning
    databases 16
    slowlog-log-slower-than 10000
    slowlog-max-len 128

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-platform-dev
  labels:
    app: redis
    environment: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: redis
      environment: dev
  template:
    metadata:
      labels:
        app: redis
        environment: dev
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6379"
    spec:
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - redis
              topologyKey: kubernetes.io/hostname

      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent

        command:
        - redis-server
        - /usr/local/etc/redis/redis.conf

        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        volumeMounts:
        - name: redis-config
          mountPath: /usr/local/etc/redis
          readOnly: true
        - name: redis-data
          mountPath: /data

      volumes:
      - name: redis-config
        configMap:
          name: redis-config
      - name: redis-data
        emptyDir:
          sizeLimit: 512Mi

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: ai-platform-dev
  labels:
    app: redis
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: redis
    environment: dev
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  sessionAffinity: None
