---
# ConfigMap for Development
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-config
  namespace: ai-platform-dev
  labels:
    app: ai-platform
    environment: dev
data:
  ENVIRONMENT: "development"
  DEBUG: "false"
  REDIS_URL: "redis://redis-service.ai-platform-dev.svc.cluster.local:6379/0"
  API_URL: "http://api-service.ai-platform-dev.svc.cluster.local:8000"
  FRONTEND_URL: "http://web-service.ai-platform-dev.svc.cluster.local:3000"
  DATABASE_HOST: "postgres.ai-platform-dev.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "ai_platform"
  DATABASE_USER: "postgres"
  LOG_LEVEL: "info"
  WORKERS: "4"
  MAX_CONNECTIONS: "20"
  POOL_SIZE: "10"
  TIMEOUT: "30"

---
# Secrets for Development
apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secrets
  namespace: ai-platform-dev
  labels:
    app: ai-platform
    environment: dev
type: Opaque
stringData:
  # Database credentials
  POSTGRES_PASSWORD: "dev-postgres-password-change-in-production"
  DATABASE_URL: "postgresql://postgres:dev-postgres-password-change-in-production@postgres.ai-platform-dev.svc.cluster.local:5432/ai_platform?sslmode=disable"

  # JWT secret
  JWT_SECRET: "your-jwt-secret-key-min-32-chars"

  # LLM API Keys
  OPENAI_API_KEY: "sk-your-openai-key"
  ANTHROPIC_API_KEY: "sk-ant-your-anthropic-key"
  GOOGLE_API_KEY: "your-google-api-key"

  # Optional: OAuth secrets
  GITHUB_CLIENT_ID: "your-github-client-id"
  GITHUB_CLIENT_SECRET: "your-github-client-secret"

---
# ConfigMap for Staging
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-config
  namespace: ai-platform-staging
  labels:
    app: ai-platform
    environment: staging
data:
  ENVIRONMENT: "staging"
  DEBUG: "false"
  REDIS_URL: "redis://redis-service.ai-platform-staging.svc.cluster.local:6379/0"
  API_URL: "https://api-staging.example.com"
  FRONTEND_URL: "https://staging.example.com"
  DATABASE_HOST: "postgres.ai-platform-staging.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "ai_platform"
  DATABASE_USER: "postgres"
  LOG_LEVEL: "info"
  WORKERS: "8"
  MAX_CONNECTIONS: "50"
  POOL_SIZE: "20"
  TIMEOUT: "30"

---
# Secrets for Staging
apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secrets
  namespace: ai-platform-staging
  labels:
    app: ai-platform
    environment: staging
type: Opaque
stringData:
  POSTGRES_PASSWORD: "staging-postgres-password"
  DATABASE_URL: "postgresql://postgres:staging-postgres-password@postgres.ai-platform-staging.svc.cluster.local:5432/ai_platform?sslmode=require"
  JWT_SECRET: "staging-jwt-secret-min-32-characters"
  OPENAI_API_KEY: "sk-your-openai-staging-key"
  ANTHROPIC_API_KEY: "sk-ant-your-anthropic-staging-key"
  GOOGLE_API_KEY: "your-google-staging-api-key"
  GITHUB_CLIENT_ID: "staging-github-client-id"
  GITHUB_CLIENT_SECRET: "staging-github-client-secret"

---
# ConfigMap for Production
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-config
  namespace: ai-platform-production
  labels:
    app: ai-platform
    environment: production
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  REDIS_URL: "redis://redis-service.ai-platform-production.svc.cluster.local:6379/0"
  API_URL: "https://api.example.com"
  FRONTEND_URL: "https://example.com"
  DATABASE_HOST: "postgres.ai-platform-production.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "ai_platform"
  DATABASE_USER: "postgres"
  LOG_LEVEL: "warning"
  WORKERS: "16"
  MAX_CONNECTIONS: "100"
  POOL_SIZE: "50"
  TIMEOUT: "30"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"

---
# Secrets for Production (should use External Secrets Operator or sealed-secrets)
apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secrets
  namespace: ai-platform-production
  labels:
    app: ai-platform
    environment: production
type: Opaque
stringData:
  # IMPORTANT: Use external secret management in production
  # This is a placeholder - replace with actual secrets from secret manager
  POSTGRES_PASSWORD: "REPLACE-WITH-ACTUAL-PASSWORD"
  DATABASE_URL: "REPLACE-WITH-ACTUAL-DATABASE-URL"
  JWT_SECRET: "REPLACE-WITH-ACTUAL-JWT-SECRET"
  OPENAI_API_KEY: "REPLACE-WITH-ACTUAL-KEY"
  ANTHROPIC_API_KEY: "REPLACE-WITH-ACTUAL-KEY"
  GOOGLE_API_KEY: "REPLACE-WITH-ACTUAL-KEY"
  GITHUB_CLIENT_ID: "REPLACE-WITH-ACTUAL-ID"
  GITHUB_CLIENT_SECRET: "REPLACE-WITH-ACTUAL-SECRET"

---
# RBAC - ClusterRole for API
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-role
  labels:
    app: api
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

---
# RBAC - ClusterRoleBinding for API
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-rolebinding
  labels:
    app: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-role
subjects:
- kind: ServiceAccount
  name: api-service-account
  namespace: ai-platform-dev

---
# RBAC - ClusterRole for Web
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: web-role
  labels:
    app: web
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
# RBAC - ClusterRoleBinding for Web
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: web-rolebinding
  labels:
    app: web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: web-role
subjects:
- kind: ServiceAccount
  name: web-service-account
  namespace: ai-platform-dev
